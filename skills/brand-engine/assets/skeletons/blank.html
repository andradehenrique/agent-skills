<body class="min-h-svh bg-canvas font-sans text-fg antialiased" data-format="blank">
  <a href="#conteudo" class="be-skip">Pular para o conteúdo</a>

  <!-- blank · só o essencial. O switch fica fixo no canto; mova se houver header. -->
  <div class="fixed right-3 top-3 z-50">
    {{THEME_TOGGLE}}
  </div>

  <main id="conteudo" class="mx-auto max-w-3xl px-3 py-10 sm:px-4">
    <!-- logo: breathing area / área de respiro = S (var(--b-space-1)) em todos os lados. -->
    {{LOGO_HEADER}}
    <h1 class="mt-8 text-3xl font-semibold tracking-tight md:text-5xl">{{TITLE}}</h1>
    <p class="mt-3 text-lg text-fg-muted">{{PURPOSE}}</p>
    <ul class="mt-6 flex flex-wrap gap-2" aria-label="Atributos da marca">
      {{ATTRIBUTE_CHIPS}}
    </ul>
  </main>
</body>
